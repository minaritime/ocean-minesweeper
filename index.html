<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>바다 지뢰찾기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<style>
  :root {
    --bar: #0f3b57;
    --bar-hi: #1b5678;
    --ink: #f3f8fb;
    --muted: #a9c6d6;
    --accent: #ffb347;
    --deep: #082233;
    --card: #ffffff;
    --card-ink: #17303f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; touch-action: none; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bar);
    box-shadow: 0 2px 8px rgba(0,0,0,.35); z-index: 2; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 6px 0 0; letter-spacing: -0.3px; white-space: nowrap; }
  .levels { display: flex; background: rgba(0,0,0,.25); border-radius: 8px; padding: 3px; }
  .levels button { border: 0; background: transparent; color: var(--muted); padding: 6px 11px; border-radius: 6px;
    font: inherit; font-size: 14px; cursor: pointer; }
  .levels button[aria-pressed="true"] { background: var(--bar-hi); color: var(--ink); font-weight: 700; }
  .stat { display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; font-size: 16px;
    font-weight: 700; min-width: 64px; }
  .spacer { flex: 1; }
  .icon-btn { border: 0; background: var(--bar-hi); color: var(--ink); width: 38px; height: 38px; border-radius: 9px;
    font-size: 18px; cursor: pointer; display: grid; place-items: center; }
  .icon-btn:hover { filter: brightness(1.15); }
  .icon-btn[aria-pressed="true"] { background: var(--accent); }
  main { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  canvas.grabbing { cursor: grabbing; }
  .zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .zoom .icon-btn { box-shadow: 0 2px 6px rgba(0,0,0,.4); font-weight: 700; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  .overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(4,18,28,.55); z-index: 5; }
  .overlay.show { display: grid; animation: fade .2s ease-out; }
  .card { background: var(--card); color: var(--card-ink); width: min(320px, calc(100vw - 32px)); border-radius: 16px;
    padding: 22px 22px 18px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.45); animation: pop .25s ease-out; }
  .card .big { font-size: 44px; line-height: 1; }
  .card h2 { margin: 8px 0 14px; font-size: 22px; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .rows div { background: #eef5f9; border-radius: 10px; padding: 10px 6px; }
  .rows small { display: block; color: #5b7686; font-size: 12px; margin-bottom: 3px; }
  .rows b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .card .record { color: #e07b00; font-weight: 700; margin: -6px 0 12px; min-height: 1em; font-size: 14px; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; border: 0; border-radius: 10px; padding: 12px 0; font: inherit; font-size: 16px;
    font-weight: 700; cursor: pointer; }
  .primary { background: #1976d2; color: #fff; }
  .secondary { background: #e3ebf0; color: var(--card-ink); }
  .actions button:focus-visible, .icon-btn:focus-visible, .levels button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  @media (max-width: 560px) {
    h1 { display: none; }
    header { gap: 6px; padding: 6px 8px; }
    .levels button { padding: 6px 8px; font-size: 13px; }
    .stat { min-width: 52px; font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <h1>🌊 바다 지뢰찾기</h1>
  <div class="levels" role="group" aria-label="난이도">
    <button data-level="easy">쉬움</button>
    <button data-level="normal">보통</button>
    <button data-level="hard">어려움</button>
  </div>
  <div class="stat" title="남은 깃발">🚩 <span id="flags">0</span></div>
  <div class="stat" title="시간">⏱ <span id="time">0</span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="flagMode" aria-pressed="false" title="깃발 모드 (F)">⛏</button>
  <button class="icon-btn" id="restart" title="새 판 (R)">🔄</button>
</header>
<main>
  <div id="status">지도를 불러오는 중…</div>
  <canvas id="board"></canvas>
  <div class="zoom">
    <button class="icon-btn" id="zoomIn" title="확대">＋</button>
    <button class="icon-btn" id="zoomOut" title="축소">－</button>
    <button class="icon-btn" id="zoomFit" title="전체 보기">⤢</button>
  </div>
</main>
<div class="overlay" id="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="card">
    <div class="big" id="resultIcon"></div>
    <h2 id="resultTitle"></h2>
    <div class="record" id="resultRecord"></div>
    <div class="rows">
      <div><small>시간</small><b id="resultTime"></b></div>
      <div><small id="resultSubLabel"></small><b id="resultSub"></b></div>
    </div>
    <div class="actions">
      <button class="secondary" id="viewMap">지도 보기</button>
      <button class="primary" id="again">다시 하기</button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
