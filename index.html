<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>세계지도 지뢰찾기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<style>
  :root {
    --bar: #0f3b57;
    --bar-hi: #1b5678;
    --ink: #f3f8fb;
    --muted: #a9c6d6;
    --accent: #ffb347;
    --deep: #082233;
    --card: #ffffff;
    --card-ink: #17303f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--deep); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; touch-action: none; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bar);
    box-shadow: 0 2px 8px rgba(0,0,0,.35); z-index: 2; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 6px 0 0; letter-spacing: -0.3px; white-space: nowrap; }
  .levels { display: flex; background: rgba(0,0,0,.25); border-radius: 8px; padding: 3px; }
  .levels button { border: 0; background: transparent; color: var(--muted); padding: 6px 11px; border-radius: 6px;
    font: inherit; font-size: 14px; cursor: pointer; }
  .levels button[aria-pressed="true"] { background: var(--bar-hi); color: var(--ink); font-weight: 700; }
  .stat { display: flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; font-size: 16px;
    font-weight: 700; min-width: 64px; }
  .spacer { flex: 1; }
  .icon-btn { border: 0; background: var(--bar-hi); color: var(--ink); width: 38px; height: 38px; border-radius: 9px;
    font-size: 18px; cursor: pointer; display: grid; place-items: center; }
  .icon-btn:hover { filter: brightness(1.15); }
  .icon-btn[aria-pressed="true"] { background: var(--accent); }
  main { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  canvas.grabbing { cursor: grabbing; }
  .zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .zoom .icon-btn { box-shadow: 0 2px 6px rgba(0,0,0,.4); font-weight: 700; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  .overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(4,18,28,.55); z-index: 5; }
  .overlay.show { display: grid; animation: fade .2s ease-out; }
  .card { background: var(--card); color: var(--card-ink); width: min(320px, calc(100vw - 32px)); border-radius: 16px;
    padding: 22px 22px 18px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.45); animation: pop .25s ease-out; }
  .card .big { font-size: 44px; line-height: 1; }
  .card h2 { margin: 8px 0 14px; font-size: 22px; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .rows div { background: #eef5f9; border-radius: 10px; padding: 10px 6px; }
  .rows small { display: block; color: #5b7686; font-size: 12px; margin-bottom: 3px; }
  .rows b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .card .record { color: #e07b00; font-weight: 700; margin: -6px 0 12px; min-height: 1em; font-size: 14px; }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 1; border: 0; border-radius: 10px; padding: 12px 0; font: inherit; font-size: 16px;
    font-weight: 700; cursor: pointer; }
  .primary { background: #1976d2; color: #fff; }
  .secondary { background: #e3ebf0; color: var(--card-ink); }
  .actions button:focus-visible, .icon-btn:focus-visible, .levels button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .link { border: 0; background: none; color: #1976d2; font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; margin: -4px 0 12px; padding: 4px 8px; border-radius: 6px; }
  .link:hover { background: #eef5f9; }
  .card.wide { width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 40px); display: flex; flex-direction: column;
    text-align: left; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-head h2 { margin: 0; font-size: 20px; }
  .close { border: 0; background: #eef5f9; color: var(--card-ink); width: 34px; height: 34px; border-radius: 9px;
    font-size: 16px; cursor: pointer; }
  .tabs { background: #e3ebf0; margin-bottom: 12px; }
  .tabs button { flex: 1; color: #5b7686; }
  .tabs button[aria-pressed="true"] { background: #fff; color: var(--card-ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .rows.three { grid-template-columns: 1fr 1fr 1fr; text-align: center; margin-bottom: 10px; }
  .rows.three b { font-size: 16px; }
  .sort { display: flex; gap: 6px; margin-bottom: 8px; }
  .sort button { border: 1px solid #d3e0e8; background: #fff; color: #5b7686; border-radius: 999px; padding: 5px 12px;
    font: inherit; font-size: 13px; cursor: pointer; }
  .sort button[aria-pressed="true"] { background: var(--card-ink); border-color: var(--card-ink); color: #fff; }
  .rec-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 80px; }
  .rec-list li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 9px 6px;
    border-bottom: 1px solid #eef2f5; font-variant-numeric: tabular-nums; }
  .rec-list li.fresh { background: #fff6e5; border-radius: 8px; }
  .rec-list .rank { font-weight: 800; color: #8aa1ae; text-align: center; }
  .rec-list li:nth-child(-n+3) .rank { color: #e07b00; }
  .rec-list .t { font-weight: 800; font-size: 16px; }
  .rec-list .d { color: #7a909c; font-size: 13px; text-align: right; }
  .rec-list .empty { display: block; text-align: center; color: #8aa1ae; padding: 28px 0; border: 0; }
  .rows b.small-b { font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #b71c1c; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s;
    z-index: 9; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; }
  .toast.info { background: #1b5678; }
  canvas.aiming { cursor: crosshair; }
  .ability-bar { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap;
    max-width: calc(100% - 90px); }
  .ability-bar[hidden] { display: none; }
  .ability { position: relative; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 12px;
    padding: 8px 12px 8px 10px; background: var(--bar); color: var(--ink); font: inherit; font-size: 15px;
    font-weight: 700; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.45); transition: transform .12s ease-out; }
  .ability:hover { transform: translateY(-2px); background: var(--bar-hi); }
  .ability[aria-pressed="true"] { background: var(--accent); color: #3a2400; transform: translateY(-3px);
    box-shadow: 0 0 0 3px rgba(255,179,71,.35), 0 6px 14px rgba(0,0,0,.45); }
  .ability.passive { cursor: default; background: #1d4a3a; }
  .ability.passive:hover { transform: none; }
  .ability:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ab-key { font-size: 11px; color: var(--muted); background: rgba(0,0,0,.25); border-radius: 5px; padding: 1px 5px; }
  .ability[aria-pressed="true"] .ab-key { color: #3a2400; background: rgba(255,255,255,.4); }
  .ab-icon { font-size: 19px; line-height: 1; }
  .ab-uses { font-variant-numeric: tabular-nums; font-size: 13px; opacity: .85; }
  .offer-list { display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .offer-item { display: grid; grid-template-columns: 22px 34px 1fr; align-items: center; gap: 8px; border: 2px solid #e3ebf0;
    background: #fff; border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--card-ink); cursor: pointer;
    transition: border-color .12s, transform .12s; }
  .offer-item:hover, .offer-item:focus-visible { border-color: var(--accent); transform: translateX(3px); outline: none; }
  .of-key { font-size: 12px; font-weight: 800; color: #8aa1ae; text-align: center; }
  .of-icon { font-size: 26px; line-height: 1; text-align: center; }
  .of-text b { display: block; font-size: 16px; }
  .of-text small { color: #5b7686; font-size: 13px; }
  .rec-list .picks { margin-left: 6px; font-size: 13px; letter-spacing: 1px; }
  .tabs.modes-tabs button[aria-pressed="true"] { color: #b06000; }
  .now { background: rgba(0,0,0,.25); color: var(--accent); border-radius: 8px; padding: 6px 10px; font-size: 14px;
    font-weight: 700; white-space: nowrap; }
  #start { background: radial-gradient(ellipse at center, rgba(4,18,28,.45), rgba(4,18,28,.8)); overflow-y: auto; }
  .start-wrap { display: flex; flex-direction: column; align-items: center; padding: 24px 0; }
  .start-card { width: min(380px, calc(100vw - 32px)); position: relative; z-index: 1; }
  .start-card h2 { margin-bottom: 18px; }
  .pick-label { text-align: left; font-size: 13px; font-weight: 800; color: #5b7686; margin: 0 0 6px 2px; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .pick.four { grid-template-columns: repeat(4, 1fr); }
  .pick button { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px solid #e3ebf0;
    background: #f6f9fb; color: var(--card-ink); border-radius: 12px; padding: 12px 4px; font: inherit; font-size: 15px;
    font-weight: 700; cursor: pointer; transition: border-color .12s, background .12s, transform .12s; }
  .pick button:hover { border-color: #b9ccd8; transform: translateY(-1px); }
  .pick button[aria-pressed="true"] { border-color: #1976d2; background: #e8f2fc; color: #0d4f91; }
  .pick button:focus-visible, .start-go:focus-visible, .sign:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .pick-icon { font-size: 26px; line-height: 1; }
  .start-go { width: 100%; border: 0; border-radius: 12px; padding: 14px 0; font: inherit; font-size: 18px; font-weight: 800;
    cursor: pointer; box-shadow: 0 4px 0 #0d4f91; transition: transform .08s, box-shadow .08s; }
  .start-go:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d4f91; }
  .sign { position: relative; margin-top: 30px; width: min(300px, calc(100vw - 64px)); border: 3px solid #5e3b17;
    border-radius: 10px; padding: 12px 16px 13px; cursor: pointer; font: inherit; color: #fff4dc; text-align: center;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 9px, rgba(70,40,12,.18) 9px 11px),
      linear-gradient(#b07b44, #8c5a2a);
    box-shadow: inset 0 2px 0 rgba(255,230,190,.35), 0 8px 18px rgba(0,0,0,.45);
    transform: rotate(-1.5deg); transform-origin: 50% -30px; transition: transform .2s ease-out; }
  .sign[hidden] { display: none; }
  .sign::before, .sign::after { content: ""; position: absolute; top: -33px; width: 4px; height: 33px;
    background: linear-gradient(#7a5226, #5e3b17); border-radius: 2px; }
  .sign::before { left: 20%; }
  .sign::after { right: 20%; }
  .sign:hover { transform: rotate(1deg); }
  .sign:active { transform: rotate(0deg) translateY(2px); }
  .sign-title { display: block; font-size: 19px; font-weight: 800; text-shadow: 0 1px 0 rgba(60,30,5,.6); }
  .sign-info { display: block; margin-top: 3px; font-size: 13px; font-variant-numeric: tabular-nums; color: #f5dfb8; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  @media (max-width: 560px) {
    h1 { display: none; }
    header { gap: 6px; padding: 6px 8px; }
    .now { font-size: 12px; padding: 4px 8px; }
    .pick button { padding: 10px 4px; font-size: 14px; }
    .pick-icon { font-size: 22px; }
    .ability { padding: 7px 9px; font-size: 14px; }
    .ab-key { display: none; }
    .levels button { flex: 1; padding: 6px 8px; font-size: 13px; }
    .stat { min-width: 0; font-size: 15px; }
    .icon-btn { width: 34px; height: 34px; font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>🌍 세계지도 지뢰찾기</h1>
  <div class="now" id="gameLabel"></div>
  <div class="stat" title="남은 깃발">🚩 <span id="flags">0</span></div>
  <div class="stat" title="시간">⏱ <span id="time">0</span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="flagMode" aria-pressed="false" title="깃발 모드 (F)">⛏</button>
  <button class="icon-btn" id="openRecords" title="기록 (H)">📜</button>
  <button class="icon-btn" id="restart" title="새 판 (R)">🔄</button>
</header>
<main>
  <div id="status">지도를 불러오는 중…</div>
  <canvas id="board"></canvas>
  <div class="ability-bar" id="abilityBar" hidden></div>
  <div class="zoom">
    <button class="icon-btn" id="zoomIn" title="확대">＋</button>
    <button class="icon-btn" id="zoomOut" title="축소">－</button>
    <button class="icon-btn" id="zoomFit" title="전체 보기">⤢</button>
  </div>
</main>
<div class="overlay" id="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="card">
    <div class="big" id="resultIcon"></div>
    <h2 id="resultTitle"></h2>
    <div class="record" id="resultRecord"></div>
    <div class="rows">
      <div><small>시간</small><b id="resultTime"></b></div>
      <div><small id="resultSubLabel"></small><b id="resultSub"></b></div>
    </div>
    <button class="link" id="resultRecords">기록 보기</button>
    <div class="actions">
      <button class="secondary" id="viewMap">지도 보기</button>
      <button class="primary" id="again">다시 하기</button>
    </div>
  </div>
</div>
<div class="overlay" id="records" role="dialog" aria-modal="true" aria-labelledby="recordsTitle">
  <div class="card wide">
    <div class="card-head">
      <h2 id="recordsTitle">📜 클리어 기록</h2>
      <button class="close" id="closeRecords" aria-label="닫기">✕</button>
    </div>
    <div class="levels tabs modes-tabs" id="recordModes" role="tablist"></div>
    <div class="levels tabs" id="recordTabs" role="tablist"></div>
    <div class="rows three">
      <div><small>최고 기록</small><b id="recBest">없음</b></div>
      <div><small>클리어</small><b id="recClears">0</b></div>
      <div><small>도전</small><b id="recPlays">0</b></div>
    </div>
    <div class="sort" role="group" aria-label="정렬">
      <button data-sort="time" aria-pressed="true">빠른 순</button>
      <button data-sort="recent" aria-pressed="false">최근 순</button>
    </div>
    <ol class="rec-list" id="recList"></ol>
  </div>
</div>
<div class="overlay" id="start" role="dialog" aria-modal="true" aria-labelledby="startTitle">
  <div class="start-wrap">
    <div class="card start-card">
      <div class="big">🌍</div>
      <h2 id="startTitle">세계지도 지뢰찾기</h2>
      <div class="pick-label">모드</div>
      <div class="pick" id="pickMode" role="group" aria-label="모드"></div>
      <div class="pick-label">난이도</div>
      <div class="pick four" id="pickLevel" role="group" aria-label="난이도"></div>
      <button class="primary start-go" id="startGo">게임 시작</button>
    </div>
    <button class="sign" id="continueGo" hidden>
      <span class="sign-title">🧭 이어하기</span>
      <span class="sign-info" id="continueInfo"></span>
    </button>
  </div>
</div>
<div class="overlay" id="offer" role="dialog" aria-modal="true" aria-labelledby="offerTitle">
  <div class="card">
    <div class="big">🎁</div>
    <h2 id="offerTitle">능력 고르기</h2>
    <div class="record" id="offerStage"></div>
    <div class="offer-list" id="offerList"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
